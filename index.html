button{font:inherit;color:inherit;cursor:pointer}

/* pantalla inicial */
#intro{position:fixed;inset:0;display:grid;place-items:center;padding:16px;z-index:20;
  background:radial-gradient(ellipse at 50% 30%,color-mix(in srgb, var(--verde) 85%, transparent),color-mix(in srgb, var(--fondo) 97%, transparent) 70%);transition:opacity .9s,visibility .9s}
#intro.gone{opacity:0;visibility:hidden}
.box{max-width:640px;width:100%;text-align:center}
.kicker{font-size:13px;letter-spacing:.32em;font-weight:700;color:var(--oro);text-transform:uppercase}
h1{font-family:"Playfair Display",Georgia,serif;font-size:clamp(40px,8vw,84px);line-height:1;margin:14px 0 10px;
  background:linear-gradient(color-mix(in srgb, var(--dorado) 45%, #fff),var(--dorado) 55%,color-mix(in srgb, var(--dorado) 70%, #000));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(16px,2.4vw,20px);line-height:1.5;color:color-mix(in srgb, var(--crema) 85%, var(--holo));margin:0 auto 26px;max-width:520px}
.lead em{color:color-mix(in srgb, var(--dorado) 45%, #fff);font-family:"Playfair Display",Georgia,serif}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{border:1.5px solid var(--dorado);background:color-mix(in srgb, var(--verde) 60%, transparent);border-radius:999px;padding:14px 26px;font-weight:700;font-size:16px;transition:transform .15s,background .2s}
.btn:hover{transform:translateY(-2px);background:color-mix(in srgb, var(--verde) 95%, transparent)}
.btn.main{background:linear-gradient(color-mix(in srgb, var(--dorado) 75%, #fff),var(--dorado));color:#1a1405;border-color:transparent;box-shadow:0 0 30px color-mix(in srgb, var(--oro) 35%, transparent)}
.keys{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;font-size:13px;color:color-mix(in srgb, var(--crema) 75%, var(--fondo))}
.keys div{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:8px}
kbd{display:inline-block;min-width:22px;padding:1px 6px;border-radius:5px;background:color-mix(in srgb, var(--verde) 40%, var(--fondo));border:1px solid var(--linea);color:color-mix(in srgb, var(--dorado) 45%, #fff);font:600 12px/1.6 Inter,sans-serif;margin-right:4px}
.foot{margin-top:18px;font-size:12px;color:color-mix(in srgb, var(--crema) 55%, var(--fondo))}
body:not(.ready) .btn.main{opacity:.5;pointer-events:none}
body:not(.ready) .btn.main::after{content:" (cargando…)"}

/* HUD */
.hud{position:fixed;z-index:5;transition:opacity .4s}
body:not(.run) .hud{opacity:0;pointer-events:none}
body.clean .hud.soft{opacity:0;pointer-events:none}
#brand{top:14px;left:16px;font-size:12px;letter-spacing:.22em;font-weight:700;color:var(--oro);text-transform:uppercase;text-shadow:0 1px 8px #000}

#where{top:14px;right:16px;font-size:13px;color:color-mix(in srgb, var(--crema) 85%, var(--holo));text-shadow:0 1px 8px #000;max-width:55vw;text-align:right}
#lineWrap{left:50%;bottom:62px;transform:translateX(-50%);width:min(860px,calc(100% - 32px));display:flex;gap:12px;align-items:flex-start;
  background:var(--vidrio);border:1px solid var(--linea);border-radius:16px;padding:12px 16px;backdrop-filter:blur(6px);box-shadow:0 10px 40px rgba(0,0,0,.45)}
body.noline #lineWrap,body.noguide #lineWrap{opacity:0}
#who{flex:none;font-weight:800;font-size:13px;letter-spacing:.12em;background:linear-gradient(color-mix(in srgb, var(--dorado) 75%, #fff),var(--dorado));color:#1a1405;border-radius:8px;padding:4px 9px;margin-top:3px}
#line{font-size:clamp(16px,2.1vw,22px);line-height:1.4;min-height:1.4em}
#bar{left:0;right:0;bottom:12px;display:flex;justify-content:center;align-items:center;gap:10px;padding:0 12px}
#dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dot{width:26px;height:26px;border-radius:50%;border:1.5px solid color-mix(in srgb, var(--dorado) 60%, transparent);background:color-mix(in srgb, var(--fondo) 60%, transparent);font-size:11px;font-weight:800;color:color-mix(in srgb, var(--dorado) 45%, #fff);display:grid;place-items:center;transition:all .25s}
.dot.done{background:color-mix(in srgb, var(--verde) 90%, transparent)}
.dot.on{background:var(--oro);color:#1a1405;box-shadow:0 0 14px color-mix(in srgb, var(--oro) 80%, transparent);transform:scale(1.15)}
.ctl{width:36px;height:36px;border-radius:10px;border:1px solid var(--linea);background:color-mix(in srgb, var(--fondo) 65%, transparent);font-size:16px;display:grid;place-items:center}
.ctl.on{background:color-mix(in srgb, var(--verde) 95%, transparent);border-color:var(--holo);color:var(--holo)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:15}
#fade.on{opacity:1}
@media (max-width:640px){ #where{display:none} #lineWrap{bottom:96px} .dot{width:22px;height:22px} }
</style>
</head>

<canvas id="c"></canvas>

<div id="intro">
  <div class="box">
    <div class="kicker" id="kick"></div>
    <h1 id="h1"></h1>
    <p class="lead" id="leadTxt"></p>
    <div class="row">
      <button class="btn main" id="btnGo">▶ Empezar el recorrido</button>
      <button class="btn" id="btnFS2">⛶ Pantalla completa</button>
    </div>
    <div class="keys">
      <div><kbd>→</kbd><kbd>Espacio</kbd> avanzar</div>
      <div><kbd>←</kbd> volver</div>
      <div><kbd>1</kbd>…<kbd>9</kbd> ir a una parada numerada</div>
      <div><kbd>F</kbd> pantalla completa</div>
      <div><kbd>A</kbd> modo automático</div>
      <div><kbd>S</kbd> sonido · <kbd>B</kbd> subtítulos · <kbd>H</kbd> ocultar</div>
    </div>
    <p class="foot">También anda con el control de diapositivas, con clic o tocando la pantalla. Arrastrá para mirar alrededor.<br><span id="footTxt"></span></p>
  </div>
</div>

<div class="hud soft" id="brand"><span id="brandTxt"></span></div>
<div class="hud soft" id="where"></div>
<div class="hud" id="lineWrap"><span id="who">GUÍA</span><span id="line"></span></div>
<div class="hud soft" id="bar">
  <button class="ctl" id="btnPrev" title="Volver (←)" aria-label="Volver">◀</button>
  <div id="dots"></div>
  <button class="ctl" id="btnNext" title="Avanzar (→)" aria-label="Avanzar">▶</button>
  <button class="ctl" id="btnAuto" title="Automático (A)" aria-label="Modo automático">⟳</button>
  <button class="ctl" id="btnSnd" title="Sonido (S)" aria-label="Sonido">♪</button>
  <button class="ctl" id="btnFS" title="Pantalla completa (F)" aria-label="Pantalla completa">⛶</button>
</div>
